spring:
  application:
    name: knowledge-base-api
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:knowledge-base-web}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            redirect-uri: ${APP_FRONTEND_URL:http://127.0.0.1:5173}/login/oauth2/code/keycloak
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER:http://127.0.0.1:5173/auth/realms/knowledge-base}
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/knowledgebase}
    username: ${DB_USER:knowledgebase}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
  error:
    include-message: never
    include-stacktrace: never
app:
  frontend-url: ${APP_FRONTEND_URL:http://127.0.0.1:5173}
